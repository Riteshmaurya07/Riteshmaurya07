<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="500" viewBox="0 0 1100 500" role="img" aria-labelledby="title desc"><title id="title">Ritesh Maurya technology ecosystem</title><desc id="desc">Illustrative orbit diagram and technology groups.</desc><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#22d3ee"/><stop offset=".52" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/></linearGradient><radialGradient id="a"><stop stop-color="#a78bfa" stop-opacity=".23"/><stop offset="1" stop-color="#0d0e16" stop-opacity="0"/></radialGradient><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".8" fill="#a1a1b5" opacity=".15"/></pattern><filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><style>text{font-family:Inter,Segoe UI,Arial,sans-serif}.muted{fill:#a1a1b5}.small{font-size:13px}.title{fill:#f8fafc;font-weight:700}.card{fill:#121421;stroke:#34364b;stroke-width:1}.accent{fill:url(#g)}.mono{font-family:Consolas,monospace}@keyframes float{50%{transform:translateY(-6px)}}@keyframes pulse{50%{opacity:.35}}@keyframes sweep{to{stroke-dashoffset:-240}}@keyframes orbit{to{transform:rotate(360deg)}}.float{animation:float 4s ease-in-out infinite}.pulse{animation:pulse 1.6s ease-in-out infinite}.sweep{stroke-dasharray:45 190;animation:sweep 5s linear infinite}</style></defs><rect width="100%" height="100%" rx="24" fill="#0d0e16"/><rect width="100%" height="100%" rx="24" fill="url(#dots)"/><ellipse cx="858.0" cy="140.0" rx="330.0" ry="225.0" fill="url(#a)"/><circle cx="550" cy="190" r="126" fill="none" stroke="#22d3ee" stroke-opacity=".5" stroke-width="1.5"/><ellipse cx="550" cy="190" rx="215" ry="82" transform="rotate(-28 550 190)" fill="none" stroke="#a78bfa" stroke-opacity=".6"/><ellipse cx="550" cy="190" rx="285" ry="112" transform="rotate(27 550 190)" f